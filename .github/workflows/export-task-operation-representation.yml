name: Export task-operation-representation analysis

on:
  push:
    branches:
      - analysis/task-operation-representation-sankey-20260903
    paths:
      - .github/workflows/export-task-operation-representation.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/task-operation-representation-sankey-20260903
      - name: Build analysis tables
        run: |
          python - <<'PY'
          import csv, json, math, random
          from pathlib import Path
          from collections import Counter, defaultdict

          files = sorted(Path('data/papers').glob('*.json'))
          rows=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))
              rows.append({
                  'id': d['id'],
                  'task': d['category'],
                  'representation': d['representation'],
                  'operations': d.get('operations', []),
              })
          assert len(rows)==172

          with open('paper_paths.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f)
              w.writerow(['id','task','representation','operations'])
              for r in rows:
                  w.writerow([r['id'],r['task'],r['representation'],'|'.join(r['operations'])])

          # Fractional flows: each paper contributes total weight 1 across its operations.
          task_op=defaultdict(float)
          op_repr=defaultdict(float)
          triple=defaultdict(float)
          raw_triple=Counter()
          for r in rows:
              ops=r['operations'] or ['none']
              weight=1.0/len(ops)
              for op in ops:
                  task_op[(r['task'],op)] += weight
                  op_repr[(op,r['representation'])] += weight
                  triple[(r['task'],op,r['representation'])] += weight
                  raw_triple[(r['task'],op,r['representation'])] += 1

          with open('task_operation_flows.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['task','operation','weight'])
              for (a,b),v in sorted(task_op.items()): w.writerow([a,b,round(v,6)])
          with open('operation_representation_flows.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['operation','representation','weight'])
              for (a,b),v in sorted(op_repr.items()): w.writerow([a,b,round(v,6)])
          with open('triple_flows.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['task','operation','representation','fractional_weight','raw_papers'])
              for key,v in sorted(triple.items()): w.writerow([*key,round(v,6),raw_triple[key]])

          summary={
              'papers':len(rows),
              'tasks':Counter(r['task'] for r in rows),
              'representations':Counter(r['representation'] for r in rows),
              'operations':Counter(op for r in rows for op in r['operations']),
              'fractional_task_operation_total':sum(task_op.values()),
              'fractional_operation_representation_total':sum(op_repr.values()),
          }
          Path('summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task-operation-representation-analysis
          path: |
            paper_paths.csv
            task_operation_flows.csv
            operation_representation_flows.csv
            triple_flows.csv
            summary.json
          retention-days: 2
