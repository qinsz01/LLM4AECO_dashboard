name: Package dashboard layout preview

on:
  push:
    branches: [fix/dashboard-layout-and-heatmap-legend]
    paths: [.github/workflows/package-dashboard-layout-preview.yml]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-layout-and-heatmap-legend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: |
          node --check js/app.js
          node --check js/charts.js
          node --check js/i18n.js
          node --check js/dashboard-layout.js
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('data/index.json').read_text(encoding='utf-8'))
          assert len(index) == 172
          assert 'dimension: 2' in Path('js/dashboard-layout.js').read_text(encoding='utf-8')
          for entry in index:
              paper = json.loads((Path('data') / entry['file']).read_text(encoding='utf-8'))
              assert isinstance(paper.get('operations'), list)
              assert paper.get('operationEvidence')
          PY
      - name: Package offline preview
        run: |
          mkdir -p preview
          cp -r index.html paper.html css js data preview/
          rm -rf preview/data/papers/*.pdf preview/data/papers/*.md || true
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js -o preview/js/echarts.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js#js/echarts.min.js#' preview/index.html
      - name: Render previews
        run: |
          python3 -m http.server 8765 --directory preview >/tmp/dashboard-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1200 --virtual-time-budget=12000 --screenshot=dashboard-layout.png http://127.0.0.1:8765/index.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,3000 --virtual-time-budget=12000 --screenshot=dashboard-layout-tall.png http://127.0.0.1:8765/index.html
          test -s dashboard-layout.png && test -s dashboard-layout-tall.png
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-layout-preview
          path: |
            preview
            dashboard-layout.png
            dashboard-layout-tall.png
          retention-days: 3
