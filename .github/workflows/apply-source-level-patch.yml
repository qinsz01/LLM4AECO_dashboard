name: Apply source-level audit patch

on:
  push:
    branches:
      - feature/multilabel-operation-coding
    paths:
      - .github/source_patch/RUN

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multilabel-operation-coding

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source-level updates
        run: python .github/source_patch/update_source_levels.py

      - name: Validate audit data
        shell: bash
        run: |
          python -m json.tool data/operation_coding.json >/dev/null
          grep -q 'Accessible full text reviewed: \*\*22\*\*' data/OPERATION_CODING_AUDIT.md
          grep -q 'primary text still pending: \*\*71\*\*' data/OPERATION_CODING_AUDIT.md

      - name: Commit updates and clean temporary files
        shell: bash
        run: |
          rm -rf .github/source_patch
          rm -f .github/workflows/apply-source-level-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audit: update primary-source verification levels"
          git push origin HEAD:feature/multilabel-operation-coding
