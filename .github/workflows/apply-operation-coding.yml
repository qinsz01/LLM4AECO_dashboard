name: Apply audited operation coding

on:
  push:
    branches:
      - feature/multilabel-operation-coding

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multilabel-operation-coding

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write data and patch dashboard
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(compile(base64.b64decode('???'), '<operation-dashboard-patch>', 'exec'))
          PY

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          node --check js/app.js
          node --check js/charts.js
          node --check js/i18n.js
          python -m json.tool data/operation_coding.json >/dev/null
          python -m json.tool data/operation_associations.json >/dev/null

      - name: Commit feature and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-operation-coding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operation_coding.json data/operation_associations.json data/OPERATION_CODING_AUDIT.md \
                  index.html js/app.js js/charts.js js/i18n.js css/style.css \
                  .github/workflows/apply-operation-coding.yml
          git commit -m "feat: add audited multi-label operation analysis"
          git push origin HEAD:feature/multilabel-operation-coding