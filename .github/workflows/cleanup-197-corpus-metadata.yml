name: Cleanup 197-corpus metadata

on:
  push:
    branches:
      - cleanup-197-corpus-metadata

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-197-corpus-metadata
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cleanup
        run: python .tmp_cleanup_197_dashboard.py
      - name: Validate active corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          base = json.loads(Path('data/index.json').read_text(encoding='utf-8'))
          add = json.loads(Path('data/manual_additions.json').read_text(encoding='utf-8'))
          excl = json.loads(Path('data/excluded_secondary_studies.json').read_text(encoding='utf-8'))
          excluded = {x['id'] for x in excl}
          active = [x for x in base if x['id'] not in excluded] + add
          ids = [x['id'] for x in active]
          assert len(base) == 172
          assert len(add) == 27
          assert len(excluded) == 2
          assert len(active) == len(set(ids)) == 197
          ops = Counter()
          for rec in active:
              p = json.loads(Path('data', rec['file']).read_text(encoding='utf-8'))
              assert p['id'] == rec['id']
              xs = list(p.get('operations') or [])
              assert xs, p['id']
              assert p.get('operationEvidence'), p['id']
              assert p.get('operationCodingBasis') == 'full_text', p['id']
              ops.update(xs)
          assert sum(ops.values()) == 445
          m = json.loads(Path('data/papers/mehrishal2025.json').read_text(encoding='utf-8'))
          assert m['journal'] == 'Remote Sensing'
          assert m['doi'] == '10.3390/rs17162891'
          assert m['firstOnlineDate'] == '2025-08-20'
          print('active', len(active))
          print('operation_assignments', sum(ops.values()))
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers/mehrishal2025.json data/index.json data/OPERATION_CODING.md data/CORPUS_RECONCILIATION.md
          git commit -m 'Correct corpus metadata and operation-coding provenance'
          git push origin HEAD:cleanup-197-corpus-metadata
