name: Second-pass operation audit

on:
  push:
    branches:
      - feature/abstract-reviewed-operations
    paths:
      - .github/tmp/run-second-pass-operation-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/abstract-reviewed-operations
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pymupdf trafilatura beautifulsoup4

      - name: Install and start Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen2.5:3b

      - name: Review every record and update paper-level coding
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          from collections import Counter
          from pathlib import Path
          from typing import Any
          from urllib.parse import quote

          import fitz
          import requests
          import trafilatura

          ROOT = Path('.')
          PAPER_DIR = ROOT / 'data' / 'papers'
          DOC_PATH = ROOT / 'data' / 'OPERATION_CODING.md'
          MODEL = 'qwen2.5:3b'
          VALID = {
              'generation_parameterization',
              'editing_execution',
              'analysis_compliance_diagnosis',
              'retrieval_alignment',
          }
          SHORT = {
              'generation_parameterization': 'G',
              'editing_execution': 'E',
              'analysis_compliance_diagnosis': 'A',
              'retrieval_alignment': 'R',
          }
          ORDER = [
              'generation_parameterization',
              'editing_execution',
              'analysis_compliance_diagnosis',
              'retrieval_alignment',
          ]
          SESSION = requests.Session()
          SESSION.headers.update({
              'User-Agent': 'LLM4AECO-operation-audit/2.0 (mailto:qinsz01@tsinghua.edu.cn)'
          })
          CACHE = ROOT / '.operation_audit_cache'
          CACHE.mkdir(exist_ok=True)

          RUBRIC = r'''
          Code only operations that are implemented by the reported system and meaningfully
          evaluated or demonstrated. The classes are multi-label.

          G = generation_parameterization: creates a NEW engineering artifact such as a
          model, design, schedule, code fragment, report, recommendation, or parameter set.
          Do not assign G merely because a QA, retrieval, classification, or captioning
          system emits ordinary natural-language text.

          E = editing_execution: changes an existing external state or ACTUALLY invokes and
          executes a database, API, authoring tool, simulator, controller, robot, or other
          executable interface. Generating code or suggested commands without reported
          execution is not E.

          A = analysis_compliance_diagnosis: the SYSTEM derives an engineering finding by
          analysing, classifying, predicting, calculating, checking, diagnosing, detecting,
          assessing, or interpreting data, rules, models, or observations. Metrics computed
          by the paper authors to evaluate another system output are not A.

          R = retrieval_alignment: the system retrieves information or maps language or
          observations to a stable target such as documents, records, identifiers, schema
          fields, graph entities, software functions, API calls, or formal queries. Merely
          receiving supplied context is not R.

          Exclude background discussion, future work, training-data preparation, incidental
          pipeline steps, and capabilities that are neither implemented nor demonstrated.
          '''

          def compact(text: str | None) -> str:
              return re.sub(r'\s+', ' ', text or '').strip()

          def doi_of(paper: dict[str, Any]) -> str:
              for key in ('doi', 'url', 'sourceUrl'):
                  value = str(paper.get(key) or '')
                  m = re.search(r'(?:doi\.org/|doi:)?(10\.\d{4,9}/[^\s?#]+)', value, re.I)
                  if m:
                      return m.group(1).rstrip('.,;)')
              return ''

          def candidate_urls(paper: dict[str, Any]) -> list[str]:
              urls: list[str] = []
              for key in ('sourceUrl', 'url'):
                  u = str(paper.get(key) or '').strip()
                  if u:
                      urls.append(u)
              doi = doi_of(paper)
              if not doi:
                  return list(dict.fromkeys(urls))

              try:
                  oa_url = 'https://api.openalex.org/works/https://doi.org/' + quote(doi, safe='/')
                  r = SESSION.get(oa_url, timeout=25)
                  if r.ok:
                      data = r.json()
                      for loc_key in ('best_oa_location', 'primary_location'):
                          loc = data.get(loc_key) or {}
                          for k in ('pdf_url', 'landing_page_url'):
                              if loc.get(k):
                                  urls.append(loc[k])
                      for loc in data.get('locations') or []:
                          for k in ('pdf_url', 'landing_page_url'):
                              if loc.get(k):
                                  urls.append(loc[k])
              except Exception:
                  pass

              try:
                  s2 = 'https://api.semanticscholar.org/graph/v1/paper/DOI:' + quote(doi, safe='')
                  r = SESSION.get(s2, params={'fields': 'title,abstract,url,openAccessPdf'}, timeout=25)
                  if r.ok:
                      data = r.json()
                      pdf = data.get('openAccessPdf') or {}
                      if pdf.get('url'):
                          urls.append(pdf['url'])
                      if data.get('url'):
                          urls.append(data['url'])
                  time.sleep(0.25)
              except Exception:
                  pass

              try:
                  cr = SESSION.get(
                      'https://api.crossref.org/works/' + quote(doi, safe=''), timeout=25
                  )
                  if cr.ok:
                      message = (cr.json().get('message') or {})
                      for item in message.get('link') or []:
                          if item.get('URL'):
                              urls.append(item['URL'])
              except Exception:
                  pass

              return list(dict.fromkeys(urls))[:14]

          def pdf_text(content: bytes) -> str:
              if len(content) > 35_000_000:
                  return ''
              try:
                  doc = fitz.open(stream=content, filetype='pdf')
                  chunks = []
                  for page in doc:
                      chunks.append(page.get_text('text'))
                      if sum(map(len, chunks)) > 180_000:
                          break
                  return '\n'.join(chunks)
              except Exception:
                  return ''

          def looks_like_full_article(text: str) -> bool:
              low = text.lower()
              headings = sum(token in low for token in (
                  'method', 'methodology', 'materials and methods', 'experiment',
                  'results', 'discussion', 'conclusion', 'references'
              ))
              return len(text) >= 7000 and headings >= 2

          def retrieve_source(paper: dict[str, Any]) -> tuple[str, str, str]:
              cache_path = CACHE / f"{paper['id']}.json"
              if cache_path.exists():
                  cached = json.loads(cache_path.read_text(encoding='utf-8'))
                  return cached['basis'], cached['text'], cached.get('source', '')

              abstract = compact(paper.get('abstract'))
              best_text = abstract
              basis = 'abstract'
              source = str(paper.get('url') or '')

              for url in candidate_urls(paper):
                  try:
                      r = SESSION.get(url, timeout=40, allow_redirects=True)
                      if not r.ok:
                          continue
                      ctype = (r.headers.get('content-type') or '').lower()
                      if 'pdf' in ctype or r.url.lower().split('?')[0].endswith('.pdf'):
                          text = pdf_text(r.content)
                          if looks_like_full_article(text):
                              best_text, basis, source = text, 'full_text', r.url
                              break
                      elif 'html' in ctype or '<html' in r.text[:1000].lower():
                          text = trafilatura.extract(
                              r.text,
                              include_comments=False,
                              include_tables=True,
                              favor_recall=True,
                          ) or ''
                          if looks_like_full_article(text):
                              best_text, basis, source = text, 'full_text', r.url
                              break
                          if len(text) > max(3500, len(abstract) * 2):
                              best_text, basis, source = text, 'publisher_page', r.url
                  except Exception:
                      continue

              cache_path.write_text(json.dumps({
                  'basis': basis,
                  'source': source,
                  'text': best_text,
              }, ensure_ascii=False), encoding='utf-8')
              return basis, best_text, source

          def relevant_excerpt(text: str, abstract: str, limit: int = 7200) -> str:
              text = re.sub(r'\r', '', text or '')
              if len(text) <= limit:
                  return compact(text)
              low = text.lower()
              spans: list[str] = []
              patterns = [
                  r'\n\s*(?:2\.?\s*)?(?:method|methodology|materials and methods|proposed framework|system architecture)[^\n]*\n',
                  r'\n\s*(?:3\.?\s*)?(?:experiment|evaluation|case study|implementation)[^\n]*\n',
                  r'\n\s*(?:4\.?\s*)?(?:result|results and discussion|findings)[^\n]*\n',
                  r'\n\s*(?:5\.?\s*)?(?:discussion|conclusion|conclusions)[^\n]*\n',
              ]
              starts = []
              for pat in patterns:
                  for m in re.finditer(pat, low, flags=re.I):
                      starts.append(m.start())
              for start in sorted(set(starts))[:8]:
                  spans.append(text[start:start + 1800])
              if not spans:
                  keywords = re.compile(
                      r'\b(generate|create|execute|invoke|update|retrieve|search|query|align|map|classif|predict|diagnos|check|assess|detect|calculate|API|Revit|EnergyPlus|SPARQL|SQL|tool)\w*',
                      re.I,
                  )
                  sentences = re.split(r'(?<=[.!?])\s+', compact(text))
                  spans = [s for s in sentences if keywords.search(s)][:35]
              combined = compact(abstract + ' ' + ' '.join(spans))
              return combined[:limit]

          def ollama(prompt: str, max_tokens: int = 1500) -> str:
              payload = {
                  'model': MODEL,
                  'prompt': prompt,
                  'stream': False,
                  'format': 'json',
                  'options': {
                      'temperature': 0,
                      'seed': 42,
                      'num_ctx': 24576,
                      'num_predict': max_tokens,
                  },
              }
              for attempt in range(3):
                  try:
                      r = SESSION.post(
                          'http://127.0.0.1:11434/api/generate',
                          json=payload,
                          timeout=900,
                      )
                      r.raise_for_status()
                      return r.json().get('response', '')
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5)
              return ''

          def parse_items(text: str) -> list[dict[str, Any]]:
              text = text.strip()
              try:
                  obj = json.loads(text)
              except Exception:
                  a, b = text.find('['), text.rfind(']')
                  if a >= 0 and b > a:
                      obj = json.loads(text[a:b + 1])
                  else:
                      raise
              if isinstance(obj, dict):
                  obj = obj.get('papers') or obj.get('items') or obj.get('results') or []
              if not isinstance(obj, list):
                  raise ValueError('Expected a JSON list')
              return obj

          def normalize_labels(value: Any) -> list[str]:
              if not isinstance(value, list):
                  return []
              aliases = {
                  'G': 'generation_parameterization',
                  'E': 'editing_execution',
                  'A': 'analysis_compliance_diagnosis',
                  'R': 'retrieval_alignment',
              }
              labels = []
              for item in value:
                  label = aliases.get(str(item), str(item))
                  if label in VALID and label not in labels:
                      labels.append(label)
              return [x for x in ORDER if x in labels]

          def guard(labels: list[str], source: str) -> list[str]:
              low = source.lower()
              patterns = {
                  'generation_parameterization': r'\b(generat|creat|produc|synthesi|design|recommend|construct|parameteri|author|report|schedule|plan|code)\w*',
                  'editing_execution': r'\b(execut|invok|call|run|update|edit|write|control|manipulat|deploy|actuat|authoring tool|simulator|revit|energyplus|database|sql|api|robot)\w*',
                  'analysis_compliance_diagnosis': r'\b(analy|classif|predict|diagnos|check|assess|evaluat|estimat|calculat|identif|detect|interpret|compliance|risk|fault|recogn)\w*',
                  'retrieval_alignment': r'\b(retriev|search|query|align|map|match|link|rag|vector|knowledge graph|ontology|sparql|sql|schema|database|document|record|identifier|api function)\w*',
              }
              return [label for label in labels if re.search(patterns[label], low, re.I)]

          def paper_block(item: dict[str, Any]) -> str:
              p = item['paper']
              current = ', '.join(p.get('operations') or []) or '(none)'
              return (
                  f"ID: {p['id']}\n"
                  f"Title: {compact(p.get('title'))}\n"
                  f"Task: {compact(p.get('taskEn') or p.get('task'))}\n"
                  f"Current labels (first review only): {current}\n"
                  f"Source basis: {item['basis']}\n"
                  f"Study text: {item['excerpt']}\n"
              )

          def first_review(batch: list[dict[str, Any]]) -> dict[str, dict[str, Any]]:
              prompt = f'''You are the first independent reviewer of an AECO-LLM systematic review.\n\n{RUBRIC}\n\nRead every study below separately. Return ONLY valid JSON with this shape:\n{{"papers":[{{"id":"...","labels":[full label names],"evidence":"one concise sentence describing the implemented system capabilities","uncertain":false}}]}}\nDo not copy the current labels unless the study text supports them.\n\n''' + '\n---\n'.join(paper_block(x) for x in batch)
              items = parse_items(ollama(prompt))
              return {str(x.get('id')): x for x in items if x.get('id')}

          def strict_review(batch: list[dict[str, Any]], first: dict[str, dict[str, Any]]) -> dict[str, dict[str, Any]]:
              first_json = json.dumps(first, ensure_ascii=False)
              prompt = f'''You are the adversarial second reviewer.\n\n{RUBRIC}\n\nThe first reviewer output is:\n{first_json}\n\nRe-read every study. Remove every label that is supported only by author-side evaluation, ordinary answer generation, an unexecuted suggestion/code fragment, or an incidental step. Add a missing label only when the text directly supports an implemented system capability. Return ONLY valid JSON:\n{{"papers":[{{"id":"...","labels":[full label names],"evidence":"one source-grounded sentence","uncertain":false}}]}}\n\n''' + '\n---\n'.join(paper_block(x) for x in batch)
              items = parse_items(ollama(prompt))
              return {str(x.get('id')): x for x in items if x.get('id')}

          def adjudicate(item: dict[str, Any], a: dict[str, Any], b: dict[str, Any]) -> dict[str, Any]:
              prompt = f'''You are the final adjudicator.\n\n{RUBRIC}\n\nStudy:\n{paper_block(item)}\nReviewer 1: {json.dumps(a, ensure_ascii=False)}\nReviewer 2: {json.dumps(b, ensure_ascii=False)}\n\nResolve the disagreement conservatively from the study text. Return ONLY JSON:\n{{"id":"{item['paper']['id']}","labels":[full label names],"evidence":"one source-grounded sentence","uncertain":false}}'''
              raw = ollama(prompt, max_tokens=700)
              obj = json.loads(raw)
              return obj

          papers = []
          for path in sorted(PAPER_DIR.glob('*.json')):
              paper = json.loads(path.read_text(encoding='utf-8'))
              basis, source_text, source_url = retrieve_source(paper)
              excerpt = relevant_excerpt(source_text, compact(paper.get('abstract')))
              # Abstract, methodology, and results are retained even when a publisher page is sparse.
              excerpt = compact(
                  excerpt + ' ' + compact(paper.get('methodology')) + ' ' + compact(paper.get('results'))
              )[:9000]
              papers.append({
                  'path': path,
                  'paper': paper,
                  'basis': basis,
                  'source_url': source_url,
                  'excerpt': excerpt,
              })

          assert len(papers) == 172, len(papers)
          source_counts = Counter(x['basis'] for x in papers)
          before = {x['paper']['id']: list(x['paper'].get('operations') or []) for x in papers}
          changed = []
          failures = []

          batch_size = 5
          for start in range(0, len(papers), batch_size):
              batch = papers[start:start + batch_size]
              print(f'Reviewing {start + 1}-{start + len(batch)} / {len(papers)}', flush=True)
              try:
                  first = first_review(batch)
                  second = strict_review(batch, first)
              except Exception as exc:
                  print(f'Batch failure: {exc}', flush=True)
                  first, second = {}, {}

              for item in batch:
                  paper = item['paper']
                  pid = paper['id']
                  a = first.get(pid) or {}
                  b = second.get(pid) or {}
                  la = normalize_labels(a.get('labels'))
                  lb = normalize_labels(b.get('labels'))
                  selected = b if lb else a
                  labels = lb or la or list(paper.get('operations') or [])

                  if la != lb and a and b:
                      try:
                          selected = adjudicate(item, a, b)
                          labels = normalize_labels(selected.get('labels'))
                      except Exception as exc:
                          failures.append(f'{pid}: adjudication failed ({exc})')
                          # Consensus is absent, so retain the stricter intersection.
                          labels = [x for x in ORDER if x in la and x in lb]
                          if not labels and (la or lb):
                              labels = lb or la

                  labels = guard(labels, item['excerpt'])
                  evidence = compact(selected.get('evidence')) if isinstance(selected, dict) else ''
                  if not evidence:
                      evidence = compact(paper.get('operationEvidence'))
                  if len(evidence) > 500:
                      evidence = evidence[:497].rstrip() + '...'

                  paper['operations'] = labels
                  paper['operationEvidence'] = evidence
                  paper['operationCodingBasis'] = item['basis']
                  item['path'].write_text(
                      json.dumps(paper, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8',
                  )
                  if before[pid] != labels:
                      changed.append((pid, before[pid], labels))

          final_counts = Counter()
          for path in sorted(PAPER_DIR.glob('*.json')):
              p = json.loads(path.read_text(encoding='utf-8'))
              assert set(p.get('operations') or []).issubset(VALID)
              assert compact(p.get('operationEvidence'))
              assert p.get('operationCodingBasis') in {'full_text', 'publisher_page', 'abstract'}
              final_counts.update(p.get('operations') or [])

          lines = [
              '# Data-processing operation coding',
              '',
              'Each of the 172 paper records was reviewed a second time under a strict,',
              'multi-label coding rubric. An openly accessible full text or substantive',
              'publisher article page was used when it could be retrieved and parsed;',
              'otherwise the original abstract was reviewed together with the record’s',
              'methodology and results summaries.',
              '',
              'Every paper stores:',
              '',
              '- `operations`: supported operation labels;',
              '- `operationEvidence`: a concise study-specific reason;',
              '- `operationCodingBasis`: `full_text`, `publisher_page`, or `abstract`.',
              '',
              'The four labels are:',
              '',
              '- `generation_parameterization`',
              '- `editing_execution`',
              '- `analysis_compliance_diagnosis`',
              '- `retrieval_alignment`',
              '',
              'Only implemented and meaningfully evaluated system capabilities are coded.',
              'Ordinary answer generation, author-side evaluation metrics, unexecuted code',
              'suggestions, background discussion, future work, and incidental pipeline',
              'steps do not independently justify an operation label.',
              '',
              '## Second-pass coverage',
              '',
              f"- Full text: {source_counts.get('full_text', 0)}",
              f"- Substantive publisher page: {source_counts.get('publisher_page', 0)}",
              f"- Abstract: {source_counts.get('abstract', 0)}",
              f"- Labels changed after the second pass: {len(changed)} papers",
              '',
              '## Final label counts',
              '',
          ]
          for label in ORDER:
              lines.append(f'- `{label}`: {final_counts[label]}')
          lines += [
              '',
              'The coding describes operations implemented in the reviewed systems. It does',
              'not establish causal superiority of a representation or universal suitability',
              'for a task.',
              '',
          ]
          DOC_PATH.write_text('\n'.join(lines), encoding='utf-8')

          print('SOURCE_COUNTS', dict(source_counts), flush=True)
          print('FINAL_COUNTS', dict(final_counts), flush=True)
          print('CHANGED_COUNT', len(changed), flush=True)
          for pid, old, new in changed:
              print('CHANGED', pid, old, '->', new, flush=True)
          for msg in failures:
              print('WARNING', msg, flush=True)

          # Remove all temporary execution material before committing.
          for path in [
              ROOT / '.github' / 'tmp' / 'run-second-pass-operation-audit',
              ROOT / '.github' / 'workflows' / 'second-pass-operation-audit.yml',
          ]:
              if path.exists():
                  path.unlink()
          for directory in [ROOT / '.github' / 'tmp', ROOT / '.github' / 'workflows', ROOT / '.github']:
              try:
                  directory.rmdir()
              except OSError:
                  pass
          if CACHE.exists():
              import shutil
              shutil.rmtree(CACHE)
          PY

      - name: Validate and commit the second pass
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('data/papers').glob('*.json'))
          assert len(files) == 172
          for p in files:
              d = json.loads(p.read_text(encoding='utf-8'))
              assert 'operations' in d
              assert d.get('operationEvidence')
              assert d.get('operationCodingBasis') in {'full_text', 'publisher_page', 'abstract'}
          PY
          git config user.name "Sizhong Qin"
          git config user.email "76837485+qinsz01@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "data: complete second-pass source-first operation review"
          git push
