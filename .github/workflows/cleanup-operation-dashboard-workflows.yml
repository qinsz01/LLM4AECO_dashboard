name: Clean temporary dashboard workflows

on:
  push:
    branches:
      - feature/operation-aware-dashboard
    paths:
      - .github/workflows/cleanup-operation-dashboard-workflows.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operation-aware-dashboard
          fetch-depth: 0
      - name: Remove temporary workflows
        run: |
          git config user.name "Sizhong Qin"
          git config user.email "76837485+qinsz01@users.noreply.github.com"
          git rm .github/workflows/validate-operation-aware-dashboard.yml
          git rm .github/workflows/cleanup-operation-dashboard-workflows.yml
          git commit -m "chore: remove temporary dashboard validation workflows"
          git push
