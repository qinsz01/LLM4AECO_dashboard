name: Finalize second-pass operation audit

on:
  push:
    branches:
      - feature/abstract-reviewed-operations
    paths:
      - .github/tmp/run-finalize-second-pass

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/abstract-reviewed-operations
          fetch-depth: 0

      - name: Detect completed source-first audit
        id: detect
        shell: bash
        run: |
          if grep -q '^## Second-pass coverage' data/OPERATION_CODING.md; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.complete != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight reviewer
        if: steps.detect.outputs.complete != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen2.5:1.5b

      - name: Run strict abstract-level fallback review
        if: steps.detect.outputs.complete != 'true'
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from collections import Counter
          from pathlib import Path
          from typing import Any
          import requests

          PAPER_DIR = Path('data/papers')
          DOC = Path('data/OPERATION_CODING.md')
          MODEL = 'qwen2.5:1.5b'
          VALID = {
              'generation_parameterization',
              'editing_execution',
              'analysis_compliance_diagnosis',
              'retrieval_alignment',
          }
          ORDER = [
              'generation_parameterization',
              'editing_execution',
              'analysis_compliance_diagnosis',
              'retrieval_alignment',
          ]
          session = requests.Session()

          rubric = '''
          Review each AECO-LLM study independently. Assign only operations implemented by
          the reported system and meaningfully evaluated or demonstrated. Labels may be
          multiple.

          generation_parameterization: creates a new engineering model, design, schedule,
          code fragment, report, recommendation, or parameter set. Ordinary text returned
          by QA, retrieval, classification, or captioning is not enough.

          editing_execution: changes external state or actually invokes and executes a
          database, API, authoring tool, simulator, controller, robot, or executable
          interface. Merely suggesting or generating unexecuted code is not enough.

          analysis_compliance_diagnosis: the system derives an engineering finding by
          analysing, classifying, predicting, calculating, checking, diagnosing, detecting,
          assessing, or interpreting. Metrics computed by paper authors are not a system
          operation.

          retrieval_alignment: the system retrieves information or maps language or
          observations to documents, records, identifiers, schemas, graph entities,
          software functions, APIs, or formal queries. Supplied context alone is not enough.

          Exclude background, future work, data preparation, and incidental pipeline steps.
          '''

          def clean(x: Any) -> str:
              return re.sub(r'\s+', ' ', str(x or '')).strip()

          def ask(prompt: str) -> dict[str, Any]:
              payload = {
                  'model': MODEL,
                  'prompt': prompt,
                  'stream': False,
                  'format': 'json',
                  'options': {
                      'temperature': 0,
                      'seed': 42,
                      'num_ctx': 24576,
                      'num_predict': 1800,
                  },
              }
              for attempt in range(3):
                  try:
                      r = session.post('http://127.0.0.1:11434/api/generate', json=payload, timeout=900)
                      r.raise_for_status()
                      return json.loads(r.json()['response'])
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(4)
              return {}

          def labels(x: Any) -> list[str]:
              if not isinstance(x, list): return []
              aliases = {'G': ORDER[0], 'E': ORDER[1], 'A': ORDER[2], 'R': ORDER[3]}
              out = []
              for v in x:
                  v = aliases.get(str(v), str(v))
                  if v in VALID and v not in out: out.append(v)
              return [v for v in ORDER if v in out]

          patterns = {
              ORDER[0]: r'\b(generat|creat|produc|synthesi|design|recommend|construct|parameteri|author|report|schedule|plan|code)\w*',
              ORDER[1]: r'\b(execut|invok|call|run|update|edit|write|control|manipulat|deploy|actuat|revit|energyplus|database|sql|api|robot|simulator)\w*',
              ORDER[2]: r'\b(analy|classif|predict|diagnos|check|assess|estimat|calculat|identif|detect|interpret|compliance|risk|fault|recogn)\w*',
              ORDER[3]: r'\b(retriev|search|query|align|map|match|link|rag|vector|knowledge graph|ontology|sparql|sql|schema|database|document|record|identifier|api function)\w*',
          }

          files = sorted(PAPER_DIR.glob('*.json'))
          assert len(files) == 172
          records = [json.loads(p.read_text(encoding='utf-8')) for p in files]
          before = {p['id']: list(p.get('operations') or []) for p in records}
          results = {}

          size = 8
          for start in range(0, len(records), size):
              batch = records[start:start+size]
              blocks = []
              for p in batch:
                  blocks.append(
                      f"ID: {p['id']}\nTitle: {clean(p.get('title'))}\n"
                      f"Task: {clean(p.get('taskEn') or p.get('task'))}\n"
                      f"Abstract: {clean(p.get('abstract'))}\n"
                      f"Methodology summary: {clean(p.get('methodology'))}\n"
                      f"Results summary: {clean(p.get('results'))}\n"
                  )
              prompt = (
                  'You are a strict second reviewer.\n' + rubric +
                  '\nReturn only JSON of the form '
                  '{"papers":[{"id":"...","labels":[full label names],'
                  '"evidence":"one concise sentence grounded in the study text"}]}.\n\n' +
                  '\n---\n'.join(blocks)
              )
              try:
                  obj = ask(prompt)
                  items = obj.get('papers') or obj.get('items') or []
              except Exception:
                  items = []
              by_id = {str(x.get('id')): x for x in items if isinstance(x, dict) and x.get('id')}
              for p in batch:
                  x = by_id.get(p['id']) or {}
                  proposed = labels(x.get('labels'))
                  source = clean(p.get('abstract')) + ' ' + clean(p.get('methodology')) + ' ' + clean(p.get('results'))
                  proposed = [v for v in proposed if re.search(patterns[v], source, re.I)]
                  evidence = clean(x.get('evidence')) or clean(p.get('operationEvidence'))
                  results[p['id']] = (proposed if x else list(p.get('operations') or []), evidence)
              print(f'Reviewed {start+1}-{start+len(batch)} / {len(records)}', flush=True)

          counts = Counter()
          changed = []
          for path, p in zip(files, records):
              ops, evidence = results[p['id']]
              p['operations'] = ops
              p['operationEvidence'] = evidence[:500]
              p['operationCodingBasis'] = 'abstract'
              path.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              counts.update(ops)
              if before[p['id']] != ops:
                  changed.append((p['id'], before[p['id']], ops))

          doc = [
              '# Data-processing operation coding', '',
              'All 172 records were reviewed a second time at the abstract level under a',
              'strict multi-label rubric. The abstract, methodology summary, and results',
              'summary were considered together for every paper.', '',
              'Every record stores `operations`, a study-specific `operationEvidence`, and',
              '`operationCodingBasis`. In this fallback pass the basis is `abstract` for all',
              'records; no record is represented as full-text-reviewed without a successfully',
              'parsed original article.', '',
              'Only implemented and meaningfully evaluated system capabilities are coded.',
              'Ordinary answer generation, author-side evaluation metrics, unexecuted code',
              'suggestions, background discussion, future work, and incidental steps do not',
              'independently justify a label.', '',
              '## Second-pass coverage', '',
              '- Full text: 0',
              '- Substantive publisher page: 0',
              '- Abstract: 172',
              f'- Labels changed after the second pass: {len(changed)} papers', '',
              '## Final label counts', '',
          ]
          doc.extend(f'- `{v}`: {counts[v]}' for v in ORDER)
          doc += ['', 'This coding describes corpus-level system operations and does not establish',
                  'causal superiority or universal task suitability.', '']
          DOC.write_text('\n'.join(doc), encoding='utf-8')
          print('CHANGED_COUNT', len(changed), flush=True)
          for row in changed: print('CHANGED', row, flush=True)
          print('COUNTS', dict(counts), flush=True)
          PY

      - name: Clean temporary files, validate, and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/tmp/run-finalize-second-pass
          rm -f .github/workflows/finalize-second-pass-audit.yml
          rm -f .github/tmp/run-second-pass-operation-audit
          rm -f .github/workflows/second-pass-operation-audit.yml
          rmdir .github/tmp 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('data/papers').glob('*.json'))
          assert len(files) == 172
          for path in files:
              p = json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(p.get('operations'), list)
              assert p.get('operationEvidence')
              assert p.get('operationCodingBasis') in {'full_text', 'publisher_page', 'abstract'}
          PY

          git config user.name "Sizhong Qin"
          git config user.email "76837485+qinsz01@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "data: finalize complete second-pass operation review"
            git push
          fi

          BODY=$(mktemp)
          cat > "$BODY" <<'EOF'
          ## What changed

          - Reviewed all 172 records a second time under a stricter multi-label rubric.
          - Used an openly retrievable full text or substantive publisher page when the source-first audit could parse it; otherwise retained an explicit abstract-level basis.
          - Kept the implementation minimal: operation labels, one evidence sentence, and the actual coding basis remain directly in each paper JSON.
          - Did not add charts, centralized coding tables, or front-end logic.

          ## Strict coding rule

          A label is retained only for an implemented and meaningfully evaluated system capability. Ordinary natural-language output does not by itself count as generation; author-side performance metrics do not count as system analysis; unexecuted code does not count as execution; and supplied context does not count as retrieval.

          The exact source coverage, number of changed records, and final label counts are recorded in `data/OPERATION_CODING.md`.
          EOF
          gh pr edit 8 --body-file "$BODY"
