name: Package paper detail source

on:
  push:
    branches:
      - fix/light-mode-paper-detail
    paths:
      - .github/workflows/apply-paper-detail-polish.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/light-mode-paper-detail
      - uses: actions/upload-artifact@v4
        with:
          name: paper-detail-source
          path: |
            index.html
            paper.html
            css
            js
            data
          retention-days: 2
