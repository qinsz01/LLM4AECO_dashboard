name: Package abstract review data

on:
  push:
    branches:
      - feature/abstract-reviewed-operations
    paths:
      - .github/workflows/package-abstract-review-data.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/abstract-reviewed-operations

      - name: Package paper records
        run: |
          mkdir -p bundle/data
          cp -r data/papers bundle/data/
          cp data/index.json bundle/data/
          cp data/OPERATION_CODING.md bundle/data/

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: abstract-reviewed-paper-data
          path: bundle
          retention-days: 3
