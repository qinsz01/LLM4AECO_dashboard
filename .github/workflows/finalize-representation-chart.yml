name: Finalize representation chart

on:
  push:
    branches:
      - agent/learned-engineered-codes

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/learned-engineered-codes
      - name: Remove legacy fallback and preserve long labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/charts.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("return REPR_MAP[val] || '其他';", "return REPR_MAP[val] || val;")
          text = text.replace(
              "grid: { left: 70, right: 30, top: 10, bottom: 70 },",
              "grid: { left: 20, right: 30, top: 10, bottom: 70, containLabel: true },",
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit chart update
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/charts.js
          git commit -m "Keep representation labels visible in dashboard charts"
          git push origin HEAD:agent/learned-engineered-codes
