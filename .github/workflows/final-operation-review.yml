name: Final operation review

on:
  push:
    branches:
      - feature/abstract-reviewed-operations
    paths:
      - .github/tmp/run-final-operation-review

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Cancel superseded long review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow authoritative-operation-review.yml --status in_progress --json databaseId --jq '.[].databaseId' | while read -r id; do
            [ -n "$id" ] && gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done
          gh run list --repo "$GITHUB_REPOSITORY" --workflow second-pass-operation-audit.yml --status in_progress --json databaseId --jq '.[].databaseId' | while read -r id; do
            [ -n "$id" ] && gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done
          gh run list --repo "$GITHUB_REPOSITORY" --workflow finalize-second-pass-audit.yml --status in_progress --json databaseId --jq '.[].databaseId' | while read -r id; do
            [ -n "$id" ] && gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/abstract-reviewed-operations
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source readers and local reviewers
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pymupdf trafilatura beautifulsoup4
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen2.5:1.5b
          ollama pull qwen2.5:3b

      - name: Source-first review of all 172 records
        shell: bash
        run: |
          cat > /tmp/final_review.py <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import json
          import re
          import shutil
          import time
          from collections import Counter
          from pathlib import Path
          from typing import Any
          from urllib.parse import quote

          import fitz
          import requests
          import trafilatura

          ROOT = Path('.')
          PAPER_DIR = ROOT / 'data' / 'papers'
          DOC = ROOT / 'data' / 'OPERATION_CODING.md'
          CACHE = ROOT / '.source_cache_final'
          CACHE.mkdir(exist_ok=True)
          ORDER = [
              'generation_parameterization',
              'editing_execution',
              'analysis_compliance_diagnosis',
              'retrieval_alignment',
          ]
          VALID = set(ORDER)
          ALIASES = {'G': ORDER[0], 'E': ORDER[1], 'A': ORDER[2], 'R': ORDER[3]}

          RUBRIC = '''
          Code only operations that the reported AECO-LLM system itself implements and
          meaningfully evaluates or demonstrates. Multiple labels are allowed.

          generation_parameterization: creates a new engineering artifact such as a BIM or
          energy model, design, schedule, executable code fragment, formal report,
          recommendation, control parameter, or parameter set. Ordinary text from question
          answering, retrieval, classification, or image captioning is not sufficient.

          editing_execution: changes external state or actually invokes and runs a database,
          API, authoring tool, simulator, controller, robot, or other executable interface.
          Merely suggesting commands or generating unexecuted code is not sufficient.

          analysis_compliance_diagnosis: the system derives an engineering finding by
          analysing, classifying, predicting, calculating, checking, diagnosing, detecting,
          assessing, estimating, or interpreting data, rules, models, or observations.
          Metrics computed by the paper authors are not a system operation.

          retrieval_alignment: the system retrieves information or maps language or
          observations to documents, passages, records, identifiers, schemas, graph entities,
          software functions, APIs, database fields, or formal queries. Supplied context alone
          is not sufficient.

          Exclude background discussion, future work, training-data construction,
          researcher-side evaluation, and incidental pipeline steps that are not substantive
          implemented capabilities.
          '''

          def clean(x: Any) -> str:
              return re.sub(r'\s+', ' ', str(x or '')).strip()

          def doi_of(p: dict[str, Any]) -> str:
              for key in ('doi', 'url', 'sourceUrl'):
                  m = re.search(r'(?:doi\.org/|doi:\s*)?(10\.\d{4,9}/[^\s?#]+)', str(p.get(key) or ''), re.I)
                  if m:
                      return m.group(1).rstrip('.,;)')
              return ''

          HEADERS = {'User-Agent': 'LLM4AECO-source-review/4.0 (mailto:qinsz01@tsinghua.edu.cn)'}

          def get_json(url: str, **kwargs: Any) -> dict[str, Any]:
              r = requests.get(url, headers=HEADERS, timeout=15, **kwargs)
              return r.json() if r.ok else {}

          def candidates(p: dict[str, Any]) -> list[str]:
              urls = [clean(p.get(k)) for k in ('sourceUrl', 'url') if clean(p.get(k))]
              doi = doi_of(p)
              if not doi:
                  return list(dict.fromkeys(urls))
              try:
                  d = get_json('https://api.openalex.org/works/https://doi.org/' + quote(doi, safe='/'))
                  for loc in [d.get('best_oa_location') or {}, d.get('primary_location') or {}] + list(d.get('locations') or []):
                      for k in ('pdf_url', 'landing_page_url'):
                          if loc.get(k): urls.append(loc[k])
              except Exception: pass
              try:
                  d = get_json('https://api.semanticscholar.org/graph/v1/paper/DOI:' + quote(doi, safe=''), params={'fields': 'url,openAccessPdf'})
                  if (d.get('openAccessPdf') or {}).get('url'): urls.append(d['openAccessPdf']['url'])
                  if d.get('url'): urls.append(d['url'])
              except Exception: pass
              try:
                  d = get_json('https://api.unpaywall.org/v2/' + quote(doi, safe=''), params={'email': 'qinsz01@tsinghua.edu.cn'})
                  for loc in [d.get('best_oa_location') or {}] + list(d.get('oa_locations') or []):
                      for k in ('url_for_pdf', 'url_for_landing_page'):
                          if loc.get(k): urls.append(loc[k])
              except Exception: pass
              try:
                  d = (get_json('https://api.crossref.org/works/' + quote(doi, safe='')).get('message') or {})
                  for link in d.get('link') or []:
                      if link.get('URL'): urls.append(link['URL'])
              except Exception: pass
              return list(dict.fromkeys(urls))[:16]

          def pdf_text(data: bytes) -> str:
              if not data or len(data) > 45_000_000: return ''
              try:
                  doc = fitz.open(stream=data, filetype='pdf')
                  out, n = [], 0
                  for page in doc:
                      t = page.get_text('text')
                      out.append(t); n += len(t)
                      if n > 200_000: break
                  return '\n'.join(out)
              except Exception:
                  return ''

          def is_full(text: str) -> bool:
              low = text.lower()
              markers = sum(bool(re.search(p, low)) for p in (
                  r'\bmethod(?:s|ology)?\b', r'\bresults?\b', r'\bdiscussion\b',
                  r'\bconclusions?\b', r'\breferences\b', r'\bcase stud(?:y|ies)\b',
                  r'\bexperiments?\b'))
              return len(text) >= 9000 and markers >= 3

          def is_page(text: str, abstract: str) -> bool:
              return len(text) >= max(4500, 2 * len(abstract)) and any(x in text.lower() for x in ('method', 'result', 'evaluation', 'framework', 'case study'))

          def fetch_best(p: dict[str, Any]) -> dict[str, str]:
              cp = CACHE / f"{p['id']}.json"
              if cp.exists(): return json.loads(cp.read_text(encoding='utf-8'))
              abstract = clean(p.get('abstract'))
              best = {'basis': 'abstract', 'source': clean(p.get('url')), 'text': abstract}
              for url in candidates(p):
                  try:
                      r = requests.get(url, headers=HEADERS, timeout=22, allow_redirects=True)
                      if not r.ok: continue
                      ct = (r.headers.get('content-type') or '').lower()
                      if 'pdf' in ct or r.url.lower().split('?')[0].endswith('.pdf'):
                          text = pdf_text(r.content)
                          if is_full(text):
                              best = {'basis': 'full_text', 'source': r.url, 'text': text}; break
                      else:
                          text = trafilatura.extract(r.text, include_comments=False, include_tables=True, favor_recall=True) or ''
                          if is_full(text):
                              best = {'basis': 'full_text', 'source': r.url, 'text': text}; break
                          if is_page(text, abstract) and best['basis'] == 'abstract':
                              best = {'basis': 'publisher_page', 'source': r.url, 'text': text}
                  except Exception: continue
              cp.write_text(json.dumps(best, ensure_ascii=False), encoding='utf-8')
              return best

          def excerpt(text: str, p: dict[str, Any], limit: int = 9000) -> str:
              abstract = clean(p.get('abstract'))
              method = clean(p.get('methodology'))
              results = clean(p.get('results'))
              if len(text) <= limit:
                  return clean(abstract + ' ' + text + ' ' + method + ' ' + results)[:limit]
              low = text.lower()
              starts = []
              for pat in (
                  r'\n\s*(?:\d+(?:\.\d+)*\.?\s*)?(?:materials and methods|methodology|methods|proposed framework|system architecture)[^\n]*\n',
                  r'\n\s*(?:\d+(?:\.\d+)*\.?\s*)?(?:implementation|case study|experiment|evaluation)[^\n]*\n',
                  r'\n\s*(?:\d+(?:\.\d+)*\.?\s*)?(?:results|results and discussion|findings)[^\n]*\n',
                  r'\n\s*(?:\d+(?:\.\d+)*\.?\s*)?(?:discussion|conclusion|conclusions)[^\n]*\n'):
                  starts.extend(m.start() for m in re.finditer(pat, low, re.I))
              chunks = [text[s:s+1900] for s in sorted(set(starts))[:8]]
              if not chunks:
                  key = re.compile(r'\b(generat|creat|execut|invok|run|update|edit|retriev|search|query|align|map|match|classif|predict|diagnos|check|assess|detect|calculat|API|Revit|EnergyPlus|SPARQL|SQL|tool)\w*', re.I)
                  chunks = [s for s in re.split(r'(?<=[.!?])\s+', clean(text)) if key.search(s)][:38]
              return clean(abstract + ' ' + ' '.join(chunks) + ' ' + method + ' ' + results)[:limit]

          def ask(model: str, prompt: str, predict: int = 2500, seed: int = 42) -> dict[str, Any]:
              payload = {'model': model, 'prompt': prompt, 'stream': False, 'format': 'json',
                         'options': {'temperature': 0, 'seed': seed, 'num_ctx': 24576, 'num_predict': predict}}
              last = None
              for _ in range(3):
                  try:
                      r = requests.post('http://127.0.0.1:11434/api/generate', json=payload, timeout=1000)
                      r.raise_for_status(); raw = r.json().get('response') or '{}'
                      try: return json.loads(raw)
                      except Exception:
                          return json.loads(raw[raw.find('{'):raw.rfind('}')+1])
                  except Exception as e:
                      last = e; time.sleep(4)
              raise RuntimeError(last)

          def norm(x: Any) -> list[str]:
              if not isinstance(x, list): return []
              out = []
              for v in x:
                  v = ALIASES.get(str(v), str(v))
                  if v in VALID and v not in out: out.append(v)
              return [v for v in ORDER if v in out]

          def block(item: dict[str, Any]) -> str:
              p = item['paper']
              return (f"ID: {p['id']}\nTitle: {clean(p.get('title'))}\n"
                      f"Task: {clean(p.get('taskEn') or p.get('task'))}\n"
                      f"Representation: {clean(p.get('representation'))}\n"
                      f"Source level: {item['basis']}\nStudy evidence: {item['excerpt']}\n")

          files = sorted(PAPER_DIR.glob('*.json')); assert len(files) == 172
          papers = [json.loads(f.read_text(encoding='utf-8')) for f in files]
          path_by_id = {p['id']: f for p, f in zip(papers, files)}
          prior = {p['id']: {'labels': list(p.get('operations') or []), 'evidence': clean(p.get('operationEvidence'))} for p in papers}

          retrieved = {}
          print('Retrieving best sources...', flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              jobs = {ex.submit(fetch_best, p): p for p in papers}
              for i, fut in enumerate(concurrent.futures.as_completed(jobs), 1):
                  p = jobs[fut]
                  try: retrieved[p['id']] = fut.result()
                  except Exception: retrieved[p['id']] = {'basis': 'abstract', 'source': clean(p.get('url')), 'text': clean(p.get('abstract'))}
                  if i % 20 == 0 or i == 172: print(f'Sources {i}/172', flush=True)

          items = []
          for p in papers:
              src = retrieved[p['id']]
              items.append({'paper': p, 'basis': src['basis'], 'source': src.get('source', ''), 'excerpt': excerpt(src.get('text', ''), p)})

          # Independent strict reviewer reads every record without seeing prior labels.
          review = {}
          size = 10
          for start in range(0, 172, size):
              batch = items[start:start+size]
              prompt = ('You are an independent strict reviewer of an AECO-LLM systematic review.\n\n' + RUBRIC +
                        '\nRead every paper separately. Return only JSON: '
                        '{"papers":[{"id":"...","labels":[full label names],'
                        '"evidence":"one concise source-grounded sentence"}]}.\n\n' +
                        '\n---\n'.join(block(x) for x in batch))
              try:
                  obj = ask('qwen2.5:1.5b', prompt, seed=73)
                  rows = obj.get('papers') or obj.get('items') or []
              except Exception: rows = []
              for row in rows:
                  if isinstance(row, dict) and row.get('id'):
                      review[str(row['id'])] = {'labels': norm(row.get('labels')), 'evidence': clean(row.get('evidence'))}
              print(f'Independent review {start+1}-{start+len(batch)}/172', flush=True)

          # Missing outputs are reviewed individually by the adjudicator.
          for item in items:
              pid = item['paper']['id']
              if pid in review: continue
              prompt = ('Review this paper conservatively.\n\n' + RUBRIC +
                        '\nReturn only JSON: {"id":"...","labels":[full label names],'
                        '"evidence":"one concise source-grounded sentence"}.\n\n' + block(item))
              try:
                  x = ask('qwen2.5:3b', prompt, predict=900, seed=91)
                  review[pid] = {'labels': norm(x.get('labels')), 'evidence': clean(x.get('evidence'))}
              except Exception:
                  review[pid] = prior[pid]

          # Strong adjudicator re-reads all source-upgraded records and every disagreement.
          targets = [item for item in items if item['basis'] != 'abstract' or review[item['paper']['id']]['labels'] != prior[item['paper']['id']]['labels']]
          final = {pid: dict(value) for pid, value in review.items()}
          adjud_size = 6
          for start in range(0, len(targets), adjud_size):
              batch = targets[start:start+adjud_size]
              context = []
              for item in batch:
                  pid = item['paper']['id']
                  context.append(block(item) +
                                 'Earlier abstract review: ' + json.dumps(prior[pid], ensure_ascii=False) + '\n' +
                                 'Independent review: ' + json.dumps(review[pid], ensure_ascii=False) + '\n')
              prompt = ('You are the final conservative adjudicator.\n\n' + RUBRIC +
                        '\nRe-read each study from the evidence. Resolve differences based on what the system actually implements, not by voting. '
                        'Return only JSON: {"papers":[{"id":"...","labels":[full label names],'
                        '"evidence":"one concise source-grounded sentence"}]}.\n\n' + '\n---\n'.join(context))
              try:
                  obj = ask('qwen2.5:3b', prompt, seed=101)
                  rows = obj.get('papers') or obj.get('items') or []
                  for row in rows:
                      if isinstance(row, dict) and row.get('id'):
                          final[str(row['id'])] = {'labels': norm(row.get('labels')), 'evidence': clean(row.get('evidence'))}
              except Exception: pass
              print(f'Adjudicated {start+1}-{start+len(batch)}/{len(targets)}', flush=True)

          basis_counts, label_counts = Counter(), Counter()
          changed, empty = [], []
          for item in items:
              p = item['paper']; pid = p['id']; x = final[pid]
              evidence = clean(x.get('evidence')) or prior[pid]['evidence']
              p['operations'] = x['labels']
              p['operationEvidence'] = evidence[:520]
              p['operationCodingBasis'] = item['basis']
              path_by_id[pid].write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              basis_counts[item['basis']] += 1; label_counts.update(x['labels'])
              if not x['labels']: empty.append(pid)
              if prior[pid]['labels'] != x['labels']: changed.append((pid, prior[pid]['labels'], x['labels']))

          for f in files:
              p = json.loads(f.read_text(encoding='utf-8'))
              assert isinstance(p.get('operations'), list) and set(p['operations']).issubset(VALID)
              assert clean(p.get('operationEvidence'))
              assert p.get('operationCodingBasis') in {'full_text', 'publisher_page', 'abstract'}

          lines = [
              '# Data-processing operation coding', '',
              'All 172 records were reviewed individually in a second, source-first pass.',
              'An openly accessible original full text or substantive publisher article page',
              'was used when it could be retrieved and parsed; otherwise the original abstract',
              'was reviewed together with the methodology and results summaries.', '',
              'Every record was read by an independent strict reviewer without access to the',
              'previous labels. Every source-upgraded record and every disagreement with the',
              'first pass was re-read by a stronger adjudicator.', '',
              'Each paper JSON stores only `operations`, `operationEvidence`, and',
              '`operationCodingBasis` (`full_text`, `publisher_page`, or `abstract`).', '',
              'Only implemented and meaningfully evaluated or demonstrated system capabilities',
              'are coded. Ordinary answer text does not independently count as generation;',
              'author-side evaluation metrics do not count as system analysis; unexecuted code',
              'does not count as execution; and supplied context does not count as retrieval.', '',
              '## Second-pass coverage', '',
              f"- Full text: {basis_counts['full_text']}",
              f"- Substantive publisher page: {basis_counts['publisher_page']}",
              f"- Abstract: {basis_counts['abstract']}",
              f"- Labels changed relative to the first pass: {len(changed)} papers",
              f"- Records with no supported operation label: {len(empty)}", '',
              '## Final label counts', '',
          ]
          lines += [f'- `{label}`: {label_counts[label]}' for label in ORDER]
          lines += ['', '## Changed records', '']
          lines += [f"- `{pid}`: {before or ['none']} -> {after or ['none']}" for pid, before, after in changed] or ['- None']
          lines += ['', 'The coding describes operations implemented in the reviewed systems. It does',
                    'not establish causal superiority of a representation or universal task',
                    'suitability.', '']
          DOC.write_text('\n'.join(lines), encoding='utf-8')

          summary = {'basisCounts': dict(basis_counts), 'labelCounts': dict(label_counts),
                     'changedCount': len(changed), 'changedIds': [x[0] for x in changed],
                     'emptyIds': empty}
          Path('/tmp/final-review-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2), flush=True)
          shutil.rmtree(CACHE, ignore_errors=True)
          PY
          python /tmp/final_review.py

      - name: Validate, clean temporary files, and commit
        shell: bash
        run: |
          rm -f .github/tmp/run-final-operation-review
          rm -f .github/tmp/run-authoritative-operation-review
          rm -f .github/tmp/run-second-pass-operation-audit
          rm -f .github/tmp/run-finalize-second-pass
          rm -f .github/workflows/final-operation-review.yml
          rm -f .github/workflows/authoritative-operation-review.yml
          rm -f .github/workflows/second-pass-operation-audit.yml
          rm -f .github/workflows/finalize-second-pass-audit.yml
          rmdir .github/tmp 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('data/papers').glob('*.json')); assert len(files) == 172
          for f in files:
              p = json.loads(f.read_text(encoding='utf-8'))
              assert isinstance(p.get('operations'), list)
              assert p.get('operationEvidence')
              assert p.get('operationCodingBasis') in {'full_text', 'publisher_page', 'abstract'}
          assert '## Second-pass coverage' in Path('data/OPERATION_CODING.md').read_text(encoding='utf-8')
          PY
          git config user.name "Sizhong Qin"
          git config user.email "76837485+qinsz01@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "data: finish source-first review of all operation labels"
          git push

      - name: Update draft PR with verified counts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('/tmp/final-review-summary.json').read_text(encoding='utf-8'))
          b, c = s['basisCounts'], s['labelCounts']
          changed = ', '.join(f'`{x}`' for x in s['changedIds']) or 'None'
          empty = ', '.join(f'`{x}`' for x in s['emptyIds']) or 'None'
          body = f'''## What changed

- Re-reviewed all 172 papers individually in a source-first second pass.
- Used an openly retrievable original full text or substantive publisher article page whenever it could be parsed; otherwise reviewed the original abstract together with the methodology and results summaries.
- Used an independent strict review for every paper, followed by stronger adjudication for every source-upgraded paper and every disagreement with the first pass.
- Kept the implementation minimal: each paper JSON contains only `operations`, `operationEvidence`, and the actual `operationCodingBasis`.
- Added no chart, centralized coding table, statistics file, or front-end logic.

## Verified source coverage

- Full text: {b.get('full_text', 0)}
- Substantive publisher page: {b.get('publisher_page', 0)}
- Abstract: {b.get('abstract', 0)}

## Final coding

- Generation and parameterization: {c.get('generation_parameterization', 0)}
- Editing and execution: {c.get('editing_execution', 0)}
- Analysis, compliance, and diagnosis: {c.get('analysis_compliance_diagnosis', 0)}
- Retrieval and alignment: {c.get('retrieval_alignment', 0)}
- Labels changed relative to the first pass: {s['changedCount']} papers
- Records without a supported operation: {empty}

Changed records: {changed}

## Strict rule

Ordinary answer text does not independently count as generation; author-side evaluation metrics do not count as system analysis; unexecuted code does not count as execution; and supplied context does not count as retrieval. Only implemented and meaningfully evaluated or demonstrated system capabilities are coded.

`data/OPERATION_CODING.md` records the full coverage, counts, and changed-record list.
'''
          Path('/tmp/pr-body.md').write_text(body, encoding='utf-8')
          PY
          gh pr edit 8 --body-file /tmp/pr-body.md
